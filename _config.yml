title: Music Intelligence Lab
email: jb50@aub.edu.lb
description: >-
  A research group at the American University of Beirut working on musical
  instruments, the structure of music, and machine learning for music.
baseurl: ""
url: "https://musicintelligencelab.com"
lang: en
defaults:
  - scope: { path: "" }
    values: { image: /assets/images/og.jpg }

markdown: kramdown
plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - TODO.md
  - deploy.sh
  - serve.sh
  - setup.sh
  - node_modules
  - scripts/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
