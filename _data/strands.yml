# Research areas and the projects under each.
# projects: rows with a picture or video. small: text-only entries.
# Add a project by copying a block. Only title and body are required.

  - id: instruments
    title: From movement to sound
    intro: |
      Playing an instrument depends on a form of physical intelligence. much of what a musician knows is in their body rather than in explicit rules. We develop a skill through practice, and what starts with mental effort becomes intuitive physical movement. Following this idea, we design instruments that translate movement into sound, and study what makes such an instrument learnable and expressive. Current projects include the musical flow rope, dance-to-music and the gluvn.
    projects:
      - id: glove
        title: 'Gluvn: A glove instrument'
        people: Joseph Bakarji, Hélène Jabbour, Samir Shaker
        youtube: rFsVS_Wkfo0
        media: /assets/images/glove-poster.jpg
        alt: Joseph Bakarji in front of a bookshelf, wearing two black sensor gloves.
        body: |
          Gluvn is a wearable glove with a flex sensor on each finger, a pressure sensors at the fingertips, and an inertial sensor on the palm. The main challenge in designing the glove is the mapping. It generates a high-dimensional continuous signal and gives no haptic feedback, so there are infinitely many ways to map it to sound, and most aren't intuitive. 
        links:
          - label: Project write-up
            url: https://www.josephbakarji.com/articles/?slug=gluvn
          - label: Preprint (arXiv:2001.09551)
            url: https://arxiv.org/abs/2001.09551
      - id: music-in-motion
        title: Music in Motion
        people: Elsa Maalouf, Olivier Chiniara, Samir Shaker, Jana Younes, Joelle Khoury
        body: |
          A two-year project, 2026 to 2028, led with Elsa Maalouf and Olivier Chiniara. It extends the rope work to free full-body movement, including dance, using wearable sensors, video pose estimation, and models that learn correspondences between movement and sound. The project will include public performances and an open-source release.

          A [browser prototype](/dance2music/live/) is available. The tool maps body pose from a webcam to sound, with the optional addition of sensors. This too is a complex movement-to-sound problem.
        links:
          - label: Pose-to-sound prototype
            url: /dance2music/live/
          - label: Announcement
            url: https://www.josephbakarji.com/articles/?slug=music-in-motion

      - id: rebal
        title: The Electric Trichord
        people: Rebal Abou Fadel, Khyam Allami
        video: /assets/video/rebal-abou-fadel.mp4
        media: /assets/images/rebal-poster.jpg
        alt: Rebal Abou Fadel playing an electric instrument with knobs and sliders, connected to a row of effects pedals, in a classroom.
        body: |
          An electrical guitar-like table-top instrument, modulated by electric motors with magnets that maintain the vibration of the strings (like an e-bow).
      - id: rope
        title: Rope Flow Music
        people: Olivier Chiniara, Samir Shaker
        youtube: UIkylBomf_M
        media: /assets/images/rope-poster.jpg
        alt: A performer on a terrace above the hills, swinging a long loop of rope.
        body: |
          This project sonifies a known movement practice called Rope Flow. It consists of a weighted rope with motion sensors at the handles. The sensor data stream into a live pipeline that classifies the rope's movement into a small vocabulary of cycles and maps each cycle to musical output through a digital audio workstation. Because the rope constrains the body to a limited set of movements, it is a tractable first case for learning mappings from motion to sound. This project was conceived with Olivier Chiniara, a biomechanics and movement specialist, interested in developing embodied ways of playing music. 
        note: Accepted to the NeurIPS 2026 Creative AI track.
        links:
          - label: Project page
            url: https://www.josephbakarji.com/projects/#proj-musical-flow-rope
  - id: structure
    title: Musical structure
    intro: |
      Music theory is built on ratios, scales and modes, and the choice of tuning system changes how it sounds. Much of the theory of Arabic music is recorded in historical treatises and has received little computational study. In this area, we model musical structure, from tuning systems and maqam theory to representations learned from recordings and scores. We also develop maqam identification algorithms based on those structures.
    projects:
      - id: archive
        title: Digital Arabic Maqam Archive (DiArMaqAr)
        people: Khyam Allami, Ibrahim El Khansa, Mohammad El Asal
        widget: maqam
        media: /assets/images/maqamarchive.png
        alt: The DiArMaqAr interface, showing a grid of maqamat and the notes of one of them on a staff.
        caption: Choose a maqam and a tuning system, then click a note to hear it. A maqam is built from ajnas, short groups of three to five notes, and the bracket marks its lowest jins, which usually gives the maqam its name. Step sizes in red fall between the semitones of a piano. The maqamat and tuning systems come from the [DiArMaqAr](https://diarmaqar.netlify.app/) platform.
        body: |
          An open-source, open-access web platform for Arabic maqam theory, developed by Khyam Allami with the lab. It brings together tuning systems (tanāghīm), tetrachords (ajnās) and modes (maqāmāt) from historical treatises and performance practice in a single interactive environment, where they can be compared and heard. The archive was launched at AUB in July 2026.
        note: ISMIR 2026.
        links:
          - label: Open the archive
            url: https://diarmaqar.netlify.app/
          - label: Code
            url: https://github.com/Music-Intelligence-Lab/DiArMaqAr
      - id: bach
        title: Latent geometry of Bach's preludes and fugues
        people: Najla Sadek
        widget: bach
        svg: bach-circle.svg
        caption: Each grey dot is a measure. The red line joins the average position of each pitch-class (major and minor)
        body: |
          We trained a feedforward autoencoder on Bach's Well-Tempered Clavier. Each prelude and fugue is normalized to 60 beats per minute and written as a binary piano roll, one frame per sixteenth note, then cut into overlapping four-beat sequences of 16 frames and 88 pitches. The encoder compresses each sequence to a 128-dimensional vector and the decoder reconstructs it. The model is trained only to reconstruct its input: no key, mode or harmonic labels are used at any point. This is followed by a PCA projection to 2D. The circle of fifths spontaneously emerges from this projection.
        note: EAIM 2026 workshop.
        links:
          - label: Paper
            url: https://openreview.net/forum?id=HXm5wUgRib
      - id: maqamnet
        title: MaqamNet
        people: Khyam Allami, Mohammad El Asal, Dany Abou Jaoude
        media: /assets/images/maqamnet-overview.png
        alt: 'Diagram of the MaqamNet framework: pitch detection, octave-folded pitch histograms, DiArMaqAr templates and tuning systems, cross-correlation, and the network.'
        caption: Figure 1 of the paper. Pitch is tracked and folded into an octave, then cross-correlated with maqam templates and tuning systems from DiArMaqAr; MaqamNet classifies the resulting tensor without first estimating the tonic.
        body: |
          A deep learning framework for identifying Arabic maqamat from audio. We show that tonic estimation is the main source of error: when the tonic is known, standard classifiers reach 91 to 94 percent accuracy, and each 25 cents of tonic error costs about 8 percentage points. MaqamNet avoids explicit tonic estimation by cross-correlating pitch histograms with maqam and jins templates from DiArMaqAr, and its learned representations can be interpreted in terms of maqam theory.
        note: ISMIR 2026.
        links:
          - label: Slides
            url: https://learn.sematlas.com/static/talks/ismir2026-maqamnet/index.html
          - label: Code and pitch data
            url: https://github.com/Music-Intelligence-Lab/maqamnet

  - id: machine
    title: Machine learning and generation
    intro: |
      Generative models learn from music made by people. We are interested in systems in which musicians and models perform together, and those require interfaces better suited to performance than a computer keyboard and a screen.
    projects:
      - id: piano-of-life
        title: Piano of Life
        widget: pol
        media: /assets/images/pol-poster.jpg
        alt: A top-down view of piano hammers.
        body: |
          A browser-based application in which a top-down video of piano hammers seeds a Game of Life, whose column density acts as a live spectral filter on the piano's audio. It is written in plain JavaScript with Canvas 2D and Web Audio. It works with any top-down piano video.
        links:
          - label: Play it
            url: https://www.josephbakarji.com/music/
          - label: How it works
            url: https://www.josephbakarji.com/articles/?slug=piano-of-life
          - label: Code
            url: https://github.com/josephbakarji/piano-of-life
      - id: aria
        title: Aria in Ableton
        people: Anthony Haber
        widget: aria
        caption: Three takes from April 2026, each a short prompt followed by Aria’s continuation, the first two at temperature 0.45 and the third at 0.9. Prompt notes are dark, Aria’s are red. Press play to hear them.
        body: |
          An integration and adaptation of Aria, an open generative piano model, into Ableton Live. The model continues a phrase played by the performer, and its output can be recorded and looped during a live performance.
        links:
          - label: Code
            url: https://github.com/Music-Intelligence-Lab/Aria-Bridge
