<footer class="foot">
  <div class="wrap foot-grid">
    <div class="foot-thanks">
      {{ site.data.home.thanks | markdownify }}
      <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    </div>
    <div class="foot-credit">
      <h2>Music in Motion</h2>
      <div class="foot-logos">
        <span class="foot-eu">
          <img src="{{ '/assets/images/logos/eu-flag.svg' | relative_url }}" alt="Flag of the European Union">
          <span>Co-funded by<br>the European Union</span>
        </span>
        <img class="foot-afac" src="{{ '/assets/images/logos/afac.png' | relative_url }}" alt="Arab Fund for Arts and Culture">
      </div>
      <p>This Project is implemented with the support of the Arab Fund for Arts and Culture – AFAC, in partnership with Oxfam, Echos Electrik, and Megaphone and co-funded by the European Union.</p>
    </div>
  </div>
</footer>
